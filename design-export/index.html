<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>ACM at UTA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
/* ============================== TOKENS ============================== */
/* Light "Warm Sand" is the default; toggle adds [data-theme="dark"] for
   "Midnight Amber". Single warm accent in both modes, used sparingly. */
:root {
  --bg:        #EAE6DC;   /* Warm Sand canvas */
  --bg-1:      #F4F1E9;   /* surface / cards */
  --bg-2:      #FBF9F3;   /* raised / hover lift */
  --text:      #1B1A17;   /* primary text */
  --text-dim:  #6E6C64;   /* muted text */
  --text-faint:#9A968B;   /* tertiary / hairline labels */
  --line:      rgba(20,18,15,0.16);
  --line-2:    rgba(20,18,15,0.26);
  --accent:    #C2640F;   /* burnt orange */
  --accent-ink:#FFF6EC;   /* text on accent */
  --accent-dim:rgba(194,100,15,0.12);
  --sel:       rgba(194,100,15,0.20);
  color-scheme: light;
}
[data-theme="dark"] {
  --bg:        #0C0C0D;   /* Midnight canvas */
  --bg-1:      #17171A;   /* surface / cards */
  --bg-2:      #212126;   /* raised / hover lift */
  --text:      #F2F0EA;   /* primary text */
  --text-dim:  #9A988F;   /* muted text */
  --text-faint:#66645C;   /* tertiary / hairline labels */
  --line:      rgba(255,255,255,0.13);
  --line-2:    rgba(255,255,255,0.22);
  --accent:    #E0892A;   /* warm amber */
  --accent-ink:#1A1206;   /* text on accent */
  --accent-dim:rgba(224,137,42,0.14);
  --sel:       rgba(224,137,42,0.22);
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
::selection { background: var(--sel); color: var(--text); }

html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Archivo', system-ui, sans-serif;
  font-size: 17px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
  transition: background .5s ease, color .5s ease;
}
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; max-width: 100%; }

/* keyboard accessibility — visible focus ring (mouse clicks stay clean) */
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
.skip-link { position: fixed; top: -60px; left: 16px; z-index: 400; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 3px; font-weight: 700; transition: top .25s; }
.skip-link:focus { top: 16px; }

/* ============================== TYPE ============================== */
.mono {
  font-family: 'JetBrains Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  font-size: 0.72rem;
  font-weight: 500;
}
.display {
  font-weight: 900;
  letter-spacing: -0.035em;
  line-height: 0.9;
  font-feature-settings: "ss01";
}
.tnum { font-variant-numeric: tabular-nums; }

/* section tag = node motif + mono label */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 0.6em;
  color: var(--text-dim);
  white-space: nowrap;
}
.tag .node {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  flex: none;
  box-shadow: 0 0 0 4px var(--accent-dim);
}

/* ============================== LAYOUT ============================== */
.wrap { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 22px; }
@media (min-width: 768px){ .wrap { padding: 0 40px; } }
.section { padding: clamp(64px, 11vw, 150px) 0; }
.hr { height: 1px; background: var(--line); border: 0; }

/* ============================== BUTTONS ============================== */
.btn {
  display: inline-flex; align-items: center; gap: 0.7em;
  font-weight: 700; font-size: 0.95rem; letter-spacing: -0.01em;
  padding: 14px 22px; border-radius: 2px; white-space: nowrap;
  transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s, color .3s, border-color .3s;
  will-change: transform;
}
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { transform: translateY(-2px); }
.btn-ghost { border: 1px solid var(--line-2); color: var(--text); }
.btn-ghost:hover { border-color: var(--text); transform: translateY(-2px); }
.btn .arrow { transition: transform .35s cubic-bezier(.2,.8,.2,1); }
.btn:hover .arrow { transform: translate(3px,-3px); }

/* ============================== MOTION ============================== */
/* scroll reveal: visible end-state is base; we animate FROM hidden */
.reveal { opacity: 0; transform: translateY(26px); transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1); }
.reveal.in { opacity: 1; transform: none; }
[data-stagger] > * { opacity: 0; transform: translateY(22px); transition: opacity .8s cubic-bezier(.16,1,.3,1), transform .8s cubic-bezier(.16,1,.3,1); }
[data-stagger].in > * { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .reveal, [data-stagger] > * { opacity: 1 !important; transform: none !important; }
}

/* scroll progress bar */
.scrollbar { position: fixed; top: 0; left: 0; height: 2px; background: var(--accent); width: 0%; z-index: 200; transition: width .1s linear; }

/* ============================== SCROLLBAR / MISC ============================== */
.noscroll { overflow: hidden; }
.app-fade { opacity: 1; }

/* placeholder image — striped, with a mono caption (no fake imagery) */
.ph {
  position: relative; overflow: hidden;
  background:
    repeating-linear-gradient(135deg, var(--bg-1) 0 11px, var(--bg-2) 11px 22px);
  border: 1px solid var(--line);
}
.ph::after {
  content: attr(data-ph);
  position: absolute; inset: 0; margin: auto; height: fit-content; width: fit-content;
  font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-faint); padding: 5px 9px; background: var(--bg);
  border: 1px solid var(--line); border-radius: 2px; white-space: nowrap;
}
</style>
<link href="src/styles.css" rel="stylesheet" />
</head>
<body>
<div class="scrollbar" id="scrollbar"></div>
<div id="root" class="app-fade"></div>
