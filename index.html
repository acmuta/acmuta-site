<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ACM at UTA</title>
    <meta name="description" content="Association for Computing Machinery at UT Arlington — a home for students who want to build, learn, and grow in computing." />
    <meta name="author" content="ACM at UTA" />

    <meta property="og:title" content="ACM at UTA" />
    <meta property="og:description" content="One of the largest tech communities at UT Arlington. Workshops, projects, research, hackathons." />
    <meta property="og:type" content="website" />

    <!-- Fonts: Archivo (body) + JetBrains Mono (mono labels) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap theme before first paint to prevent flash -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('acm-theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
